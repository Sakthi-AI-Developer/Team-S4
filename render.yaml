services:
  - type: web
    name: satellite-vision-api
    runtime: python
    rootDir: satellite-intelligence/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
