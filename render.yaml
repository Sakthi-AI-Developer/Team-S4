services:
  - type: web
    name: satellite-vision-api
    runtime: python
    buildCommand: pip install -r satellite-intelligence/backend/requirements.txt
    startCommand: uvicorn --app-dir satellite-intelligence/backend main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: CORS_ORIGINS
        value: https://team-s4-ten.vercel.app
